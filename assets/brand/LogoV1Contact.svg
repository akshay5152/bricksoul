<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glass" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="rgba(253, 253, 253, 0.2)"/>
      <stop offset="50%" stop-color="rgba(253, 253, 253, 0.05)"/>
      <stop offset="100%" stop-color="rgba(253, 253, 253, 0)"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="100" cy="100" r="80" fill="rgba(182, 145, 120, 0.15)" filter="blur(15px)" />
  <!-- Glass block -->
  <rect x="20" y="20" width="160" height="160" rx="30" fill="url(#glass)" stroke="rgba(253,253,253,0.15)" stroke-width="2" />
  <!-- Text monogram -->
  <text x="50%" y="125" font-family="'Syne', sans-serif" font-weight="800" font-size="70" fill="#b69178" text-anchor="middle">chk</text>
</svg>
