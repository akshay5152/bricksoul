<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Stylized planet with rings -->
  <circle cx="50" cy="50" r="28" fill="rgba(114, 158, 132, 0.2)" stroke="#729e84" stroke-width="2" />
  <!-- Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="12" stroke="#729e84" stroke-dasharray="4 4" stroke-width="1.5" transform="rotate(-15 50 50)" />
  <!-- Small moon orbiting -->
  <circle cx="20" cy="40" r="4" fill="#729e84" />
</svg>
